# MVTD blackout config (no AIS modality; single-object tracking).
blackout:
  durations_s: [2, 4]
  min_visible_before_s: 2.0
  min_visible_after_s: 1.0
  withhold_ais: false
  jitter_ms: 0
  ais_dropout_p: 0.0
  pool_size: 1
  episodes_per_duration_per_tracklet: 1
  seed: 42

manifest_path: data/manifests/mvtd.jsonl
episodes_path: data/gap_trials/mvtd_blackout.jsonl
