# @package _global_
# Shared experiment defaults (spec §11 example config). Experiment configs
# extend this file; resolved configs are dumped to every output dir.
experiment:
  name: _base
  seed: 42

training:
  epochs: 60
  batch_size: 32
  optimizer: adamw
  lr: 0.0003
  losses:
    id_ce_weight: 1.0
    triplet_weight: 1.0

evaluation:
  metrics: [map, rank1, rank5, rank10, minp]
  bootstrap_samples: 2000

stress:
  enabled: true
  suites: [block_occlusion, frame_dropout, haze, time_gap, disappearance_gap]

features_dir: outputs/features
blackout:
  durations_s: [10, 30, 60, 120]
  pool_size: 5
  jitter_ms: 0
  ais_dropout_p: 0.0
